name: Longform Podcast Pipeline

on:
  schedule:
    # Runs at 4:00 PM IST (10:30 UTC) every day
    - cron: '30 10 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Longform Podcast Pipeline
        env:
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # English YouTube Channel
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Tamil YouTube Channel
          YT_TAMIL_CLIENT_ID: ${{ secrets.YT_TAMIL_CLIENT_ID }}
          YT_TAMIL_CLIENT_SECRET: ${{ secrets.YT_TAMIL_CLIENT_SECRET }}
          YT_TAMIL_REFRESH_TOKEN: ${{ secrets.YT_TAMIL_REFRESH_TOKEN }}
          # Telegram (link sharing only)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python github_action_run.py

      - name: Persist AI Memory (Commit used_topics.json)
        if: always()
        run: |
          git config --global user.name "MarketDebunk-AI-Bot"
          git config --global user.email "bot@marketdebunk.com"

          if git diff --quiet used_topics.json; then
            echo "No new topics used. Nothing to commit."
          else
            git add used_topics.json
            git commit -m "chore: persist longform AI memory"
            git pull --rebase --autostash
            git push
            echo "Successfully committed used_topics.json!"
          fi
